<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="lines" width="512" height="40" patternUnits="userSpaceOnUse">
      <rect width="512" height="40" fill="#f3ead6"/><rect y="38" width="512" height="2" fill="#5a78aa" opacity=".16"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a52"/><stop offset="1" stop-color="#8a5f33"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#lines)"/>
  <rect y="408" width="512" height="104" fill="url(#desk)"/><rect y="408" width="512" height="6" fill="#d9b27c"/>
  <!-- the stack -->
  <g>
    <rect x="70" y="330" width="360" height="78" rx="8" fill="#2c3550"/><rect x="70" y="330" width="360" height="78" rx="8" fill="url(#shine)"/>
    <rect x="410" y="337" width="4" height="64" fill="#e9c97a"/><rect x="86" y="337" width="4" height="64" fill="#e9c97a"/>
    <rect x="104" y="352" width="54" height="34" rx="3" fill="#fffdf6"/>
    <rect x="96" y="246" width="350" height="84" rx="8" fill="#284a3c"/><rect x="96" y="246" width="350" height="84" rx="8" fill="url(#shine)"/>
    <rect x="426" y="254" width="4" height="68" fill="#e9c97a"/><rect x="112" y="254" width="4" height="68" fill="#e9c97a"/>
    <rect x="200" y="280" width="150" height="8" rx="4" fill="#f3dc9c" opacity=".85"/>
    <rect x="60" y="172" width="340" height="74" rx="8" fill="#7a2430" transform="rotate(-3 230 209)"/>
    <rect x="60" y="172" width="340" height="74" rx="8" fill="url(#shine)" transform="rotate(-3 230 209)"/>
    <rect x="176" y="203" width="130" height="8" rx="4" fill="#f3dc9c" opacity=".85" transform="rotate(-3 230 209)"/>
  </g>
  <!-- red rubber stamp -->
  <g transform="rotate(-14 390 112)" opacity=".92">
    <circle cx="390" cy="112" r="70" fill="none" stroke="#b8322f" stroke-width="9"/>
    <circle cx="390" cy="112" r="55" fill="none" stroke="#b8322f" stroke-width="3"/>
    <text x="390" y="140" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="80" fill="#b8322f">B</text>
  </g>
</svg>
