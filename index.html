<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ead6">
  <meta name="color-scheme" content="light">
  <title>By the Book</title>

  <!-- installable app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="By the Book">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=DM+Serif+Display:ital@0;1&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <!-- the book that comes off the shelf -->
  <div class="sheet-backdrop" hidden></div>
  <section class="sheet" role="dialog" aria-modal="true" hidden></section>

  <div class="toast" role="status" hidden></div>

  <nav class="tabbar" aria-label="ניווט">
    <button data-tab="home"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11h-5v-6H9v6z"/></svg></span><span>בית</span></button>
    <button data-tab="mybooks"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 17h18v3H3zM4.5 12.5h15v3h-15zM3.5 8h16v3h-16z"/></svg></span><span>הספרים שלי</span></button>
    <button data-tab="taste"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v10h14V7zm2 2h4v4H7zm6 0h4v1.5h-4zm0 3h4v1.5h-4zm-6 3h10v1.5H7z"/></svg></span><span>הטעם שלי</span></button>
    <button data-tab="settings"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M10.6 2h2.8l.5 2.6 1.9.8 2.2-1.5 2 2-1.5 2.2.8 1.9 2.6.5v2.8l-2.6.5-.8 1.9 1.5 2.2-2 2-2.2-1.5-1.9.8-.5 2.6h-2.8l-.5-2.6-1.9-.8-2.2 1.5-2-2 1.5-2.2-.8-1.9L2 13.4v-2.8l2.6-.5.8-1.9-1.5-2.2 2-2 2.2 1.5 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg></span><span>הגדרות</span></button>
  </nav>

  <script src="data/categories.js"></script>
  <script src="data/books.js"></script>
  <script src="js/store.js"></script>
  <script src="js/taste.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/shelf.js"></script>
  <script src="js/install.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/me.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
