<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ead6">
  <meta name="color-scheme" content="light">
  <title>By the Book</title>

  <!-- installable app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="By the Book">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=DM+Serif+Display:ital@0;1&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <!-- the book that comes off the shelf -->
  <div class="sheet-backdrop" hidden></div>
  <section class="sheet" role="dialog" aria-modal="true" hidden></section>

  <div class="toast" role="status" hidden></div>

  <nav class="tabbar" aria-label="ניווט">
    <button data-tab="home"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11h-5v-6H9v6z"/></svg></span><span>בית</span></button>
    <button data-tab="mybooks"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zM9 6h3v14H9zM14.2 5.6l2.9-.8 3.7 14.5-2.9.7z"/></svg></span><span>הספרים שלי</span></button>
  </nav>

  <script src="data/categories.js"></script>
  <script src="data/books.js"></script>
  <script src="js/store.js"></script>
  <script src="js/taste.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/shelf.js"></script>
  <script src="js/install.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
